name: Build Windows
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch verified PresentMon
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1
      - name: Verify formatting
        run: dotnet format Dedsec.Monitor.slnx --verify-no-changes
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Test, build and package
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Verify updater success and rollback
        shell: pwsh
        run: |
          ./scripts/test-updater.ps1 -Acknowledge
          ./scripts/test-updater.ps1
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: Dedsec-Monitor-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
