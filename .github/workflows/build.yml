name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fetch verified PresentMon
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1
      - name: Verify formatting
        run: dotnet format Dedsec.Monitor.slnx --verify-no-changes
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Test, build and package
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: Dedsec-Monitor-windows-x64
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dedsec-Monitor-windows-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; keeping its verified assets."
          else
            gh release create "$TAG" release/* --title "Dedsec Monitor $TAG" --generate-notes
          fi
